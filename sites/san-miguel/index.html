<style>

ize:12px;color:var(--green);display:flex;align-items:center;gap:8px}.dot{height:7px;width:7px;border-radius:50%;background:#668e44;display:inline-block}.avatar{border-radius:50%;background:#e5e8d9;padding:7px 9px;font-size:11px}.main{max-width:1480px;margin:auto;padding:35px 42px 50px}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--orange);font-weight:700}h1{font:38px/1.15 Georgia,serif;margin:9px 0 10px;letter-spacing:-1px}h2{font:23px Georgia,serif;margin:0}h3{font-size:15px;margin:0 0 6px}.sub{color:var(--muted);margin:0}.page-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:27px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hero{background:#e8edda;border:1px solid #d9e0c9;display:grid;grid-template-columns:1.25fr 1fr;border-radius:12px;margin:27px 0 23px;overflow:hidden}.hero-copy{padding:29px 32px}.hero h2{font:30px/1.25 Georgia,serif;max-width:400px;margin:10px 0}.hero p{color:#64715e;max-width:440px}.hero .pill{background:#f6f8ec}.machine{background:#e0e7cd;display:flex;align-items:center;justify-content:center;padding:20px;min-height:220px}.machine svg{width:100%;max-width:380px;height:190px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 28px}.metric{background:var(--paper);border:1px solid var(--line);padding:19px 21px;border-radius:9px}.metric .num{font:31px Georgia,serif;display:block;margin:8px 0}.metric .caption{font-size:11px;color:var(--muted)}.metric .mini{float:right;color:var(--orange)}.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}.card-head{padding:21px 23px;display:flex;align-items:center;justify-content:space-between;gap:14px}.card-head a,.textbutton{font-size:12px;color:var(--green);text-decoration:none;border:0;background:transparent;padding:2px}.card-body{padding:0 23px 23px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;text-align:left}th{font-size:10px;letter-spacing:.7px;color:#777e72;text-transform:uppercase;font-weight:600;background:#f5f6ee;padding:13px 17px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}td{padding:15px 17px;border-bottom:1px solid #eceee4;vertical-align:top}tr:last-child td{border-bottom:0}td strong{font-weight:600}td small{color:var(--muted);display:block;margin-top:4px}.pill{font-size:10px;border-radius:4px;background:#eee9da;color:#8f6a35;padding:4px 7px;display:inline-block;white-space:nowrap}.pill.confirmado{color:#426244;background:#e6eedf}.pill.pendiente{color:#97613d;background:#f5e8dc}.pill.por-verificar{color:#81703d;background:#eeeccf}.notice{font-size:12px;border:1px solid #e6dbc4;background:#f9f3e5;border-radius:7px;padding:13px 17px;color:#826943;margin:16px 0}.empty-value{color:#a0714f;font-size:12px}.list-item{padding:17px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border:0}.list-item .row{display:flex;justify-content:space-between;gap:10px;align-items:start}.list-item p{margin:5px 0 0;font-size:12px;color:var(--muted)}.section-label{font-size:10px;letter-spacing:1px;color:var(--muted);margin:14px 0 4px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar input{flex:1;min-width:180px}.toolbar input,.toolbar select{padding:10px 13px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cards .card-body{padding:22px}.cards h2{font-size:24px;margin:9px 0 15px}.cards .card{margin:0}.cards p{color:var(--muted);font-size:12px}.recipe-count{font:25px Georgia,serif}.detail-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0;gap:20px}.detail-row span{color:var(--muted)}.detail-row b{font-weight:500}.footer{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;border-top ex;justify-content:space-between;margin-top:24px;gap:15px}.danger{color:#a24f3d}#save-message{font-size:12px;color:#a24f3d;margin-top:10px}.busy{opacity:.6;pointer-events:none}.empty{padding:35px;text-align:center;color:var(--muted)}.mobile-brand{display:none}
@media(min-width:1500px){.main{padding-top:45px}.hero{grid-template-columns:1.3fr 1fr}.hero-copy{padding:35px}}
@media(max-width:1100px){.shell{grid-template-columns:200px 1fr}.side{padding:26px 12px}.main{padding:26px}.top{padding:0 26px}.cards{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero-copy{padding:24px}.hero h2{font-size:26px}}
@media(max-width:720px){.shell{display:block}.side{height:auto;position:relative;padding:17px}.brand{padding:0 0 15px;font-size:23px}.brand small{display:none}.side .label,.side-note{display:none}.nav{flex-direction:row;overflow:auto;margin-top:14px}.nav button{white-space:nowrap;padding:9px 12px;font-size:12px}.nav svg{display:none}.top{height:auto;min-height:52px;padding:12px 18px;flex-wrap:wrap}.main{padding:23px 18px}.page-head{align-items:start;flex-direction:column;gap:16px}h1{font-size:32px}.hero{grid-template-columns:1fr}.machine{min-height:160px}.machine svg{height:150px}.metrics{gap:10px}.metric{padding:15px}.metric .num{font-size:28px}.cards{grid-template-columns:1fr}.card-head{padding:19px}.footer{flex-direction:column;gap:5px}.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.question summary{padding:16px}.status{font-size:11px}}
</style></head><body>
<div class="shell"><aside class="side"><div class="brand">San Miguel<span style="color:#c9d5a5">.</span><small>CUADERNO DE PROYECTO</small></div><div class="label">ESPACIO DE TRABAJO</div><nav class="nav" aria-label="Secciones del proyecto" id="nav"></nav><div class="side-note"><strong>Tesis · Ingeniería Mecatrónica</strong>Dosificadora gravimétrica<br>Santa Cruz de la Sierra, Bolivia<br><br><span class="dot"></span> Cuatro ingredientes secos</div></aside><div class="content"><header class="top"><div class="breadcrumb">Proyecto de tesis <span style="margin:0 12px">/</span> <b id="crumb">Vista general</b></div><div class="status"><span class="dot"></span><span id="sync">Cargando registros…</span><span class="avatar">SM</span></div></header><main class="main" id="main" aria-live="polite"></main></div></div>
<dialog id="editor"><header><h2 id="edit-title">Editar registro</h2><button id="close-dialog" aria-label="Cerrar">✕</button></header><form id="edit-form"><div class="form-grid" id="fields"></div><div id="save-message" role="alert"></div><div class="form-actions"><button type="button" id="delete" class="danger">Eliminar registro</button><div class="actions"><button type="button" id="cancel">Cancelar</button><button type="submit" class="primary">Guardar cambios</button></div></div></form></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
const sections=[['resumen','Vista general'],['recetas','Recetas e ingredientes'],['requisitos','Requisitos y tolerancias'],['alternativas','Alternativas de diseño'],['componentes','Componentes'],['entrevistas','Entrevistas'],['decisiones','Decisiones técnicas'],['fuentes','Documentos y fuentes'],['redaccion','Preparar redacción']];
const paths=['M3 10 12 3l9 7v11h-6v-7H9v7H3Z','M5 3h14v18H5z M8 7h8 M8 11h8 M8 15h5','M9 5h12 M9 12h12 M9 19h12 M3 5h1 M3 12h1 M3 19h1','M4 4h6v6H4z M14 14h6v6h-6z M14 4h6v6h-6z M4 14h6v6H4z','M12 3v5 M12 16v5 M3 12h5 M16 12h5 M7 7l-3-3 M17 17l3 3 M7 17l-3 3 M17 7l3-3 M8 8h8v8H8z','M3 4h18v13H9l-6 4z','M6 3v18 M6 6h10l3 3-3 3H6','M6 3h9l5 5v13H6z M15 3v6h5','M4 4h16v16H4z M8 8h8 M8 12h8 M8 16h4'];
let data,revision=0,page='resumen',search='',filter='Todos',selected=new Set(['A','B','C']),editing=null,dirty=false;
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v===null||v===undefined||v===''?'<span class="empty-value">Por definir</span>':Number(v).toLocaleString('es-BO');
const pill=s=>`<span class="pill ${esc((s||'Pendiente').toLowerCase().replaceAll(' ','-'))}">${esc(s||'Pendiente')}</span>`;
const empty=v=>v?esc(v):'<span class="empty-value">Sin registrar</span>';
const edit=(type,id)=>`<button class="textbutton" data-edit="${type}" data-id="${esc(id)}">Editar ↗</button>`;
const go=p=>`<button class="textbutton" data-go="${p}">Ver todos ↗</button>`;
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').hidden=true,5000)}
function nav(){ $('#nav').innerHTML=sections.map(([id,n],i)=>`<button data-go="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="${paths[i]}"/></svg>${n}</button>`).join('');$('#crumb').textContent=sections.find(s=>s[0]===page)[1] }
function head(title,sub,add){return `<div class="page-head"><div><div class="eyebrow">DOSIFICADORA GRAVIMÉTRICA · SAN MIGUEL</div><h1>${title}</h1><p class="sub">${sub}</p></div>${add?`<button class="primary" data-add="${page}">＋ ${add}</button>`:'<button data-go="redaccion">↗ Preparar redacción</button>'}</div>`}
function toolbar(){return `<div class="toolbar"><input id="search" aria-label="Buscar registros" placeholder="Buscar en esta sección…" value="${esc(search)}"><select id="filter" aria-label="Filtrar por estado">${['Todos','Pendiente','Confirmado','Por verificar'].map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select></div>`}
function rows(type){return data[type].filter(r=>(filter==='Todos'||r.estado===filter)&&JSON.stringify(r).toLocaleLowerCase('es').includes(search.toLocaleLowerCase('es')))}
function table(headers,body,cls=''){return `<div class="tablewrap"><table class="${cls}"><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${headers.length}" class="empty">No hay registros con estos filtros.</td></tr>`}</tbody></table></div>`}
const machine=`<svg viewBox="0 0 420 205" fill="none" aria-label="Esquema conceptual de cuatro tolvas, alimentación y pesaje"><g stroke="#78906b" stroke-width="1.4"><path d="M36 35h95l-20 50H56z M154 35h60l-15 50h-30z M237 35h60l-15 50h-30z M320 35h60l-15 50h-30z" fill="#f0f3df"/><path d="M56 85h55v16H56z M169 85h30v16h-30z M252 85h30v16h-30z M335 85h30v16h-30z" fill="#c8d6ae"/><path d="M39 94h-15v20h103v-20h-16 M169 94h-15v20h61v-20h-16 M252 94h-15v20h61v-20h-16 M335 94h-15v20h61v-20h-16"/><path d="M103 114v13l107 28 M200 114v15l10 26 M283 114v15l-73 26 M366 114v15l-156 26" stroke-dasharray="4 4"/><path d="M165 151h90l-10 28h-70z" fill="#f0f3df"/><path d="M165 184h90v7h-90z M47 119v70 M378 119v70 M47 134h87 M295 134h83 M37 190h20 M368 190h20"/><path d="m66 91 6 10m6-10 6 10m6-10 6 10"/></g><g fill="#647b56" font-family="Segoe UI,sans-serif" font-size="8" text-anchor="middle"><text x="83" y="23">HARINA</text><text x="184" y="23">AZÚCAR</text><text x="268" y="23">SAL</text><text x="351" y="23">LEVADURA</text><text x="210" y="204">ESQUEMA CONCEPTUAL · SIN ESCALA</text></g></svg>`;
function render(){nav();let h='';if(page==='resumen'){
 const pending=data.requisitos.filter(r=>r.estado!=='Confirmado').length;
 h=head('Un proyecto, todas sus piezas.','Organiza la evidencia y avanza hacia un diseño fundamentado.')+`<section class="hero"><div class="hero-copy"><span class="pill confirmado">PROYECTO DE TESIS · EN DESARROLLO</span><h2>De la receta al diseño<br>de la dosificadora.</h2><p>Harina, azúcar, sal y levadura en polvo. Un espacio para conectar necesidades, decisiones y evidencia real.</p><button class="primary" data-go="alternativas">Explorar alternativas ↗</button></div><div class="machine">${machine}</div></section><div class="metrics"><div class="metric"><span class="mini">◌</span>Recetas registradas<span class="num">${data.recetas.length.toString().padStart(2,'0')}</span><span class="caption">Cantidades objetivo por ciclo</span></div><div class="metric"><span class="mini">↗</span>Alternativas de diseño<span class="num">${data.alternativas.length.toString().padStart(2,'0')}</span><span class="caption">Selección definitiva abierta</span></div><div class="metric"><span class="mini">◇</span>Requisitos por resolver<span class="num">${pending.toString().padStart(2,'0')}</span><span class="caption">Pendientes o por verificar</span></div><div class="metric"><span class="mini">≡</span>Respuestas registradas<span class="num">${data.entrevistas.filter(r=>r.respuesta).length}</span><span class="caption">Con fuente, sin completar vacíos</span></div></div><div class="grid"><section class="card"><div class="card-head"><h2>Recetas de referencia</h2>${go('recetas')}</div>${recipeTable(data.recetas,false)}<div class="card-body" style="padding-top:15px"><span class="sub" style="font-size:11px">Cantidades en gramos · Levadura en polvo · Masa común = un solo ciclo</span></div></section><section class="card"><div class="card-head"><h2>Lo que falta por definir</h2>${go('decisiones')}</div><div class="card-body">${[['Pesaje común o separado','Ensayar las dosis pequeñas con carga acumulada.'],['Tolerancias de los menores','Contrastar las metas de 3 / 2 / 1 g con propietaria y tutor.'],['Medidas y componentes','Medir abertura útil y tara; reunir fichas y cotizaciones.']].map(([a,b])=>`<div class="list-item"><div class="row"><h3>${a}</h3>${pill('Pendiente')}</div><p>${b}</p></div>`).join('')}</div></section></div><section class="card"><div class="card-head"><h2>Evidencia antes que supuestos</h2><span class="pill">REGLA DEL PROYECTO</span></div><div class="card-body"><p class="sub">Medición de campo → cálculo derivado → proyección → hipótesis o requisito propuesto.</p><p style="font-size:12px;color:var(--muted)">La muestra documentada comprende 7 ciclos en dos jornadas. Los valores observados no fijan el rango final de la máquina, y las metas de diseño no demuestran desempeño experimental.</p></div></section>`;
 }else if(page==='recetas'){h=head('Recetas e ingredientes','Cantidades objetivo por ciclo, expresadas en gramos.','Nueva receta')+toolbar()+`<section class="card">${recipeTable(rows('recetas'),true)}</section><div class="notice">Las recetas son referencias documentadas. Verifica su origen y trazabilidad antes de tratarlas como requisitos finales. La masa común del sábado se cuenta una sola vez.</div>`;
 }else if(page==='requisitos'){h=head('Requisitos y tolerancias','Distingue rangos observados, requisitos finales y metas de ingeniería.','Nuevo requisito')+toolbar()+`<section class="card">${table(['Requisito / ingrediente','Intervalo observado (g)','Intervalo de diseño (g)','Meta bilateral (g)','Estado',''],rows(page).map(r=>`<tr><td><strong>${esc(r.nombre)}</strong><small>${esc(r.tipo)}</small><small>${esc(r.notas)}</small></td><td>${num(r.minimo_observado)} – ${num(r.maximo_observado)}</td><td>${num(r.minimo_diseno)} – ${num(r.maximo_diseno)}</td><td>${r.tolerancia==null?num(null):'± '+num(r.tolerancia)}</td><td>${pill(r.estado)}<small>${esc(r.fuente)}</small></td><td>${edit(page,r.id)}</td></tr>`).join(''))}</section><div class="notice">D-024: las bandas de ±30 / ±3 / ±2 / ±1 g son metas de diseño del estudiante. La harina añade media de error absoluto ≤10 g. La aceptación de receta, la referencia metrológica y los ensayos siguen pendientes; la división de 1 g de la SF-400 no acredita exactitud de ±1 g.</div>`;
 }else if(page==='alternativas'){const rr=rows(page);h=head('Alternativas de diseño','Compara configuraciones completas sin atribuirles resultados no medidos.','Nueva alternativa')+toolbar()+`<div class="cards">${rr.map(r=>`<article class="card"><div class="card-body"><div class="row" style="display:flex;justify-content:space-between">${pill(r.estado)}<label class="compare-check"><input type="checkbox" data-compare="${esc(r.id)}" ${selected.has(r.id)?'checked':''}>Comparar</label></div><h2>${esc(r.nombre)}</h2><p>${esc(r.tolvas)} · ${esc(r.tornillos)}</p><div class="section-label">PESAJE</div><h3>${esc(r.pesaje)}</h3><div class="section-label">APORTE</div><p>${empty(r.ventajas)}</p><div class="section-label">POR COMPROBAR</div><p>${empty(r.pendientes)}</p><div class="detail-row"><span>Costo (Bs)</span><b>${num(r.costo)}</b></div><p>${esc(r.notas)}</p>${edit(page,r.id)}</div></article>`).join('')||'<div class="empty">Sin resultados</div>'}</div><section class="card" style="margin-top:25px"><div class="card-head"><h2>Comparación de alternativas</h2><span class="sub">Sin puntuaciones inventadas</span></div><div id="comparison">${comparison()}</div></section>`;
 }else if(page==='componentes'){h=head('Componentes','Organiza funciones, cantidades conceptuales, fichas y selección pendiente.','Nuevo componente')+toolbar()+`<section class="card">${table(['Componente','Cantidad conceptual','Modelo / costo','Estado',''],rows(page).map(r=>`<tr><td><strong>${esc(r.nombre)}</strong><small>${esc(r.funcion)}</small><small>${esc(r.pendientes)}</small></td><td>${num(r.cantidad)}</td><td>${empty(r.modelo)}<small>Bs ${num(r.costo)}</small></td><td>${pill(r.estado)}<small>${esc(r.fuente)}</small></td><td>${edit(page,r.id)}</td></tr>`).join(''))}</section>`;
 }else if(page==='entrevistas'){h=head('Entrevistas y datos faltantes','Respuestas registradas, preguntas de seguimiento y respaldo documental.','Nueva pregunta')+toolbar()+rows(page).map(r=>`<details class="question"><summary><span>${esc(r.id)} · ${esc(r.pregunta)}</span>${pill(r.estado)}</summary><div class="question-body"><p>${empty(r.persona)} · ${r.fecha?esc(r.fecha):'Fecha por verificar'}</p><blockquote>${r.respuesta?esc(r.respuesta):'<span class="empty-value">Sin respuesta registrada. No completar por suposición.</span>'}</blockquote><p><strong>Datos faltantes:</strong> ${empty(r.faltantes)}</p><p><strong>Fuente:</strong> ${empty(r.fuente)}</p><p>${esc(r.notas)}</p>${edit(page,r.id)}</div></details>`).join('');
 }else if(page==='decisiones'){h=head('Decisiones técnicas','Conserva el motivo, la fuente y las validaciones abiertas de cada decisión.','Nueva decisión')+toolbar()+`<div class="cards">${rows(page).map(r=>`<article class="card"><div class="card-body"><div class="eyebrow">${esc(r.id)}</div><h2>${esc(r.nombre)}</h2>${pill(r.estado)}<p class="decision-text">${esc(r.detalle)}</p><p><strong>Validación:</strong> ${esc(r.validacion)}</p><p>Fuente: ${esc(r.fuente)}</p>${edit(page,r.id)}</div></article>`).join('')||'<div class="empty">Sin resultados</div>'}</div><div class="notice">Editar este panel no cambia los documentos originales de la tesis. Registra evidencia y aprobación explícita antes de cerrar un asunto abierto.</div>`;
 }else if(page==='fuentes'){h=head('Documentos y fuentes','Conserva referencias, copias de respaldo y documentos nuevos.','Nueva referencia')+toolbar()+`<section class="card">${table(['Documento','Origen / notas','Estado','Acciones'],rows(page).map(r=>`<tr><td><strong>${esc(r.nombre)}</strong></td><td>${esc(r.ruta)}<small>${esc(r.notas)}</small></td><td>${pill(r.estado)}</td><td>${safeLink(r.archivo)} ${edit(page,r.id)}</td></tr>`).join(''))}</section><div class="notice">Las copias iniciales corresponden al 15/11/2026. Los documentos originales del proyecto se conservan. Puedes adjuntar documentos a una nueva referencia o enlazar una fuente HTTPS.</div>`;
 }else{h=head('Preparar redacción','Reutiliza información con trazabilidad y pendientes explícitos.')+`<section class="card export-box"><h2>Tu evidencia, lista para trabajar</h2><p class="sub">Exporta el registro completo o copia una base estructurada para la tesis. No sustituye una revisión académica.</p><div class="toolbar"><select id="export-section" aria-label="Contenido a exportar"><option value="todo">Todas las secciones</option>${sections.filter(s=>!['resumen','redaccion'].includes(s[0])).map(([i,n])=>`<option value="${i}">${n}</option>`).join('')}</select><button class="primary" id="copy">Copiar texto</button><button id="markdown">Descargar texto (.md)</button><button id="json">Respaldo (.json)</button><button id="csv">Descargar tabla (.csv)</button></div><textarea id="draft" readonly aria-label="Información preparada para redacción">${esc(markdown())}</textarea><p style="font-size:12px;color:var(--muted)">Los campos vacíos se exportan como «Sin registrar». Conserva la distinción entre evidencia y propuesta al redactar.</p></section>`}
 $('#main').innerHTML=h+`<footer class="footer"><span>San Miguel · Proyecto de tesis · Ingeniería Mecatrónica</span><span>Los datos incompletos permanecen visibles.</span></footer>`;
}
function recipeTable(rr,full){return table(['Preparación','Harina','Azúcar','Sal','Levadura',...(full?['Estado','']:[])],rr.map(r=>`<tr><td><strong>${esc(r.nombre)}</strong>${full?`<small>${esc(r.notas)}</small><small>${esc(r.fuente)}</small>`:''}</td>${['harina','azucar','sal','levadura'].map(k=>`<td>${num(r[k])}</td>`).join('')}${full?`<td>${pill(r.estado)}</td><td>${edit('recetas',r.id)}</td>`:''}</tr>`).join(''))}
function comparison(){let rr=rows('alternativas').filter(r=>selected.has(r.id));return rr.length?table(['Criterio',...rr.map(r=>esc(r.nombre))],['tolvas','tornillos','pesaje','motores','control','descarga','costo','pendientes'].map(k=>`<tr><td><strong>${labels[k]||k}</strong></td>${rr.map(r=>`<td>${k==='costo'?num(r[k]):empty(r[k])}</td>`).join('')}</tr>`).join(''),'comparison'):'<div class="empty">Selecciona al menos una alternativa para compararla.</div>'}
function safeLink(url){if(!url)return '';try{let u=new URL(url,location.origin);if(u.origin!==location.origin&&u.protocol!=='https:')return '';return `<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">Abrir documento ↗</a>`}catch{return ''}}
const labels={nombre:'Nombre',harina:'Harina (g)',azucar:'Azúcar (g)',sal:'Sal (g)',levadura:'Levadura en polvo (g)',estado:'Estado',fuente:'Fuente / respaldo',notas:'Notas y límites',ingrediente:'Ingrediente',minimo_observado:'Mínimo observado (g)',maximo_observado:'Máximo observado (g)',minimo_diseno:'Mínimo final de diseño (g)',maximo_diseno:'Máximo final de diseño (g)',tolerancia:'Meta bilateral ± (g)',tipo:'Tipo de evidencia o requisito',verificacion:'Método de verificación',tolvas:'Tolvas',tornillos:'Tornillos alimentadores',pesaje:'Sistema de pesaje',motores:'Motores y accionamiento',control:'Control e interfaz',descarga:'Descarga y transferencia',ventajas:'Aporte de la alternativa',pendientes:'Comprobaciones pendientes',costo:'Costo (Bs)',funcion:'Función',modelo:'Modelo / ficha',cantidad:'Cantidad conceptual',pregunta:'Pregunta',respuesta:'Respuesta real',persona:'Persona entrevistada',fecha:'Fecha',faltantes:'Datos faltantes',detalle:'Detalle / motivo / alcance',validacion:'Validación pendiente',ruta:'Ubicación de la fuente original',archivo:'Enlace HTTPS o documento adjunto'};
const numberKeys=['harina','azucar','sal','levadura','minimo_observado','maximo_observado','minimo_diseno','maximo_diseno','tolerancia','costo','cantidad'];
const longKeys=['notas','fuente','verificacion','ventajas','pendientes','pregunta','respuesta','faltantes','detalle','validacion','ruta'];
const stateOptions=['Pendiente','Confirmado','Por verificar'];
const schemas={"recetas": ["id", "nombre", "harina", "azucar", "sal", "levadura", "estado", "fuente", "notas"], "requisitos": ["id", "nombre", "ingrediente", "minimo_observado", "maximo_observado", "minimo_diseno", "maximo_diseno", "tolerancia", "estado", "tipo", "fuente", "verificacion", "notas"], "alternativas": ["id", "nombre", "tolvas", "tornillos", "pesaje", "motores", "control", "descarga", "ventajas", "pendientes", "costo", "estado", "fuente", "notas"], "componentes": ["id", "nombre", "funcion", "modelo", "cantidad", "estado", "fuente", "pendientes", "costo"], "entrevistas": ["id", "pregunta", "respuesta", "persona", "fecha", "estado", "fuente", "faltantes", "notas"], "decisiones": ["id", "nombre", "estado", "detalle", "fuente", "validacion"], "fuentes": ["id", "nombre", "ruta", "estado", "notas", "archivo"]};
function openEditor(type,id){const found=id?data[type].find(r=>r.id===id):null;const r=found?structuredClone(found):Object.fromEntries(schemas[type].map(k=>[k,k==='estado'?'Pendiente':numberKeys.includes(k)?null:'']));editing={type,id,record:r};$('#edit-title').textContent=found?'Editar registro':'Nuevo registro';$('#delete').hidden=!found;$('#save-message').textContent='';$('#fields').innerHTML=Object.keys(r).filter(k=>k!=='id').map(k=>`<label class="field ${longKeys.includes(k)||k==='archivo'?'wide':''}">${esc(labels[k]||k)}${k==='estado'?`<select name="${k}">${stateOptions.map(s=>`<option ${r[k]===s?'selected':''}>${s}</option>`).join('')}</select>`:k==='tipo'?`<select name="${k}">${['Medición de campo','Cálculo derivado','Proyección','Hipótesis','Requisito propuesto','Requisito confirmado'].map(s=>`<option ${r[k]===s?'selected':''}>${s}</option>`).join('')}</select>`:longKeys.includes(k)?`<textarea name="${k}" placeholder="Sin registrar">${esc(r[k])}</textarea>`:`<input name="${k}" type="${numberKeys.includes(k)?'number':k==='fecha'?'date':'text'}" ${numberKeys.includes(k)?'min="0" step="any"':''} value="${esc(r[k])}" placeholder="${numberKeys.includes(k)?'Por definir':'Sin registrar'}" ${['nombre','pregunta'].includes(k)?'required':''}>`}</label>`).join('')+(type==='fuentes'?'<label class="field wide">Adjuntar documento (máximo 20 MB)<input type="file" id="upload"><span>El archivo se guarda al confirmar el registro.</span></label>':'');$('#editor').showModal()}
async function persist(next){$('#sync').textContent='Guardando…';const res=await fetch('/api/estado',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:next,revision})});if(res.status===409)throw Error('El registro cambió en otra ventana. Copia tu cambio y recarga antes de guardar.');if(!res.ok)throw Error('No se pudo guardar. Conserva tu cambio e inténtalo de nuevo.');const r=await res.json();data=next;revision=r.revision;$('#sync').textContent='Cambios guardados';render()}
$('#edit-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;form.classList.add('busy');try{const next=structuredClone(data),r={...editing.record};for(const [k,v] of new FormData(form)){r[k]=numberKeys.includes(k)?(v===''?null:Number(v)):v}for(const pair of [['minimo_observado','maximo_observado'],['minimo_diseno','maximo_diseno']]){if(r[pair[0]]!=null&&r[pair[1]]!=null&&r[pair[0]]>r[pair[1]])throw Error('El mínimo no puede superar el máximo.')}const upload=$('#upload')?.files[0];if(upload){if(upload.size>20*1024*1024)throw Error('El documento supera 20 MB.');let fd=new FormData();fd.append('file',upload);const u=await fetch('/api/documentos',{method:'POST',body:fd});if(!u.ok)throw Error('No se pudo adjuntar el documento.');r.archivo=(await u.json()).url}if(r.archivo&&!safeLink(r.archivo))throw Error('Usa un enlace HTTPS válido.');if(editing.id)next[editing.type][next[editing.type].findIndex(x=>x.id===editing.id)]=r;else{r.id=crypto.randomUUID();next[editing.type].push(r)}await persist(next);$('#editor').close();toast('Registro guardado.')}catch(err){$('#save-message').textContent=err.message;$('#sync').textContent='Hay cambios sin guardar'}finally{form.classList.remove('busy')}};
$('#close-dialog').onclick=$('#cancel').onclick=()=>$('#editor').close();$('#delete').onclick=async()=>{if(!confirm('¿Eliminar este registro del panel? Los documentos originales de la tesis se conservan.'))return;try{let next=structuredClone(data);next[editing.type]=next[editing.type].filter(x=>x.id!==editing.id);await persist(next);$('#editor').close();toast('Registro eliminado.')}catch(e){$('#save-message').textContent=e.message}};
function markdown(which='todo'){let keys=which==='todo'?Object.keys(data):[which];return '# San Miguel — Registro para la tesis\n\nExportación: '+new Date().toLocaleDateString('es-BO')+'\n\nMedición → cálculo derivado → proyección → hipótesis/requisito. Los campos vacíos no equivalen a cero ni a aprobación. Las ediciones del panel no modifican los originales.\n\n'+keys.map(k=>'## '+sections.find(s=>s[0]===k)[1]+'\n\n'+data[k].map(r=>'### '+(r.nombre||r.pregunta||r.id)+'\n\n'+Object.entries(r).map(([key,v])=>'- '+(labels[key]||key)+': '+(v===null||v===''?'Sin registrar':v)).join('\n')).join('\n\n')).join('\n\n')}
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){page=b.dataset.go;search='';filter='Todos';history.replaceState(null,'','#'+page);render();window.scrollTo({top:0,behavior:'smooth'})}if(b.dataset.edit)openEditor(b.dataset.edit,b.dataset.id);if(b.dataset.add)openEditor(b.dataset.add);if(b.id==='copy'){try{await navigator.clipboard.writeText($('#draft').value);toast('Texto copiado.')}catch{$('#draft').select();toast('Selecciona y copia el texto mostrado.')}}if(b.id==='markdown')download($('#draft').value,'san-miguel-registro.md','text/markdown;charset=utf-8');if(b.id==='json')download(JSON.stringify({exportado:new Date().toISOString(),revision,data},null,2),'san-miguel-respaldo.json','application/json');if(b.id==='csv'){let k=$('#export-section').value;let keys=k==='todo'?Object.keys(data):[k];const quote=v=>'"'+String(v??'Sin registrar').replaceAll('"','""')+'"';download('\ufeff'+[['Sección','Registro','Campo','Valor'].map(quote).join(';'),...keys.flatMap(k=>data[k].flatMap(r=>Object.entries(r).map(([f,v])=>[k,r.nombre||r.pregunta||r.id,labels[f]||f,v].map(quote).join(';'))))].join('\r\n'),'san-miguel-tabla.csv','text/csv;charset=utf-8')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.dataset.compare){e.target.checked?selected.add(e.target.dataset.compare):selected.delete(e.target.dataset.compare);$('#comparison').innerHTML=comparison()}if(e.target.id==='export-section')$('#draft').value=markdown(e.target.value)});
async function init(){try{const r=await fetch('/api/estado');if(!r.ok)throw Error();const s=await r.json();data=s.data;revision=s.revision;page=sections.some(s=>s[0]===location.hash.slice(1))?location.hash.slice(1):'resumen';$('#sync').textContent='Registros sincronizados';render()}catch{$('#sync').textContent='Sin conexión';$('#main').innerHTML='<h1>No se pudieron cargar los registros.</h1><p>Comprueba la conexión y vuelve a intentarlo. Los registros guardados se conservan.</p><button onclick="location.reload()">Reintentar</button>'}}init();
</script></body></html>
